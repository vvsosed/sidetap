[project]
name = "sidetap"
version = "0.1.0"
description = "Real-time two-way voice interpretation for any call, captured from PipeWire"
requires-python = ">=3.11"

dependencies = [
    "google-cloud-speech>=2.27.0",
    "google-cloud-translate>=3.15.0",
    "google-cloud-texttospeech>=2.16.0",
    "webrtcvad-wheels>=2.0.14",
    # Pinned to the version actually tested, not the oldest that might work:
    # tui.py imports FooterKey from textual.widgets._footer, which is private
    # and belongs to a Footer rewrite that 0.80 predates. tests/test_tui.py
    # fails loudly if a future release moves it.
    "textual>=8.2",
]

[project.scripts]
sidetap = "sidetap.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sidetap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
